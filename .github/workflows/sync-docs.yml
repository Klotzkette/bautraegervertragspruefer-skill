name: Check published mirrors

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mirrors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check prompt and plugin mirrors
        run: python3 scripts/package_plugin.py --check

      - name: Check contract mirrors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path(".")
          for case in ("bautraegervertrag", "bautraegervertrag-marewald", "bautraegervertrag-lindenhain"):
              directory = root / "vertragsdokumente" / case
              public = root / "docs/vertragsdokumente" / case
              for source in directory.iterdir():
                  if source.suffix not in {".md", ".docx", ".pdf", ".zip", ".html"} or source.name == "README.md":
                      continue
                  target = public / source.name
                  assert target.is_file() and source.read_bytes() == target.read_bytes(), str(target)
          PY
